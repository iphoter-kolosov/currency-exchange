name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/currency-calculator-app-AoLgX]
  schedule:
    # Daily rebuild so the SEO pair-page rate snapshots stay fresh.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build (staging URL until bigrate.app DNS is live)
        env:
          # Remove this whole `env:` block when going live on bigrate.app —
          # the build will then fall back to the bigrate.app default in
          # scripts/pair-page-template.mjs and emit canonical/sitemap URLs
          # under the production domain.
          SITE_BASE: 'https://iphoter-kolosov.github.io/currency-exchange'
          BOT_USERNAME: 'bigrate_exchange_bot'
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
